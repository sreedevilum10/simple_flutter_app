name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - main # Triggers the workflow on every push to the main branch

# Grants the workflow permissions to deploy to GitHub Pages
permissions:
  contents: write
  pages: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Fetch the repository source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Set up Java (required for certain Flutter dependencies/plugins)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Initialize the Flutter environment
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable' # Uses the latest stable Flutter SDK version

      # 4. Fetch the application dependencies
      - name: Install Dependencies
        run: flutter pub get

      # 5. Compile the web version into a release build
      - name: Build Flutter Web
        run: flutter build web --release --base-href "/simple_flutter_app/"

      # 6. Deploy the compiled web artifacts to the gh-pages branch
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build/web # The directory containing your compiled Flutter web build
          branch: gh-pages  # The branch where production files are deployed
